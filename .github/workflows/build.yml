name: Build ARM v8 APK

on:
  workflow_dispatch: # Solo se activa manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Instala automáticamente la versión de Gradle definida en gradle-wrapper.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compila únicamente la variante 'github' en modo Debug para ARM v8
      - name: Build Debug APK (ARM v8 only)
        run: gradle assembleGithubDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Prepare ZIP
        run: |
          mkdir -p output
          cp app/build/outputs/apk/github/debug/*.apk output/ClintBrowser-ARMv8-debug.apk
          cd output
          zip -r ClintBrowser-ARMv8.zip ClintBrowser-ARMv8-debug.apk

      - name: Upload ZIP to Summary
        uses: actions/upload-artifact@v4
        with:
          name: ClintBrowser-ARMv8-ZIP
          path: output/ClintBrowser-ARMv8.zip
          retention-days: 7

      - name: Generate Summary
        run: |
          echo "### ✅ Compilación Exitosa" >> $GITHUB_STEP_SUMMARY
          echo "Descarga tu APK haciendo clic en la sección **Artifacts** al final de esta página." >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Ubicación |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **ClintBrowser-ARMv8.zip** | Sección Artifacts (abajo) |" >> $GITHUB_STEP_SUMMARY
