name: Build ARM v8 APK

# 1. SOLO MANUAL: Eliminamos 'on: push' para que no se ejecute solo
on:
  workflow_dispatch: # Solo se activa manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. COMPILAR SOLO ARM v8
      # El parámetro -Pandroid.injected.build.abi=arm64-v8a le dice a Gradle que solo compile esa arquitectura.
      # Si tu proyecto usa "splits" nativos, esto generará un solo APK.
      - name: Build Debug APK (ARM v8 only)
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      # 3. COMPRIMIR EN ZIP
      # Renombramos el APK para que se vea profesional y lo metemos en un ZIP.
      - name: Prepare ZIP
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ClintBrowser-ARMv8-debug.apk
          cd output
          zip -r ClintBrowser-ARMv8.zip ClintBrowser-ARMv8-debug.apk

      # 4. SUBIR AL SUMMARY (Y como Artifact descargable)
      - name: Upload ZIP to Summary
        uses: actions/upload-artifact@v4
        with:
          name: ClintBrowser-ARMv8-ZIP
          path: output/ClintBrowser-ARMv8.zip
          retention-days: 7

      # (Opcional) Si quieres que el enlace salga directamente en la pantalla del Summary:
      - name: Generate Summary
        run: |
          echo "### ✅ Compilación Exitosa" >> $GITHUB_STEP_SUMMARY
          echo "Descarga tu APK haciendo clic en el botón de abajo." >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Enlace |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **ClintBrowser-ARMv8.zip** | [Descargar Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
