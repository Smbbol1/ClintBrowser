name: Build ARM v8 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Usa automáticamente la versión definida en gradle-wrapper.properties
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (ARM v8 only)
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Prepare ZIP
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ClintBrowser-ARMv8-debug.apk
          cd output
          zip -r ClintBrowser-ARMv8.zip ClintBrowser-ARMv8-debug.apk

      - name: Upload ZIP to Summary
        uses: actions/upload-artifact@v4
        with:
          name: ClintBrowser-ARMv8-ZIP
          path: output/ClintBrowser-ARMv8.zip
          retention-days: 7

      - name: Generate Summary
        run: |
          echo "### ✅ Compilación Exitosa" >> $GITHUB_STEP_SUMMARY
          echo "Descarga tu APK haciendo clic en el botón de abajo." >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Enlace |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **ClintBrowser-ARMv8.zip** | Descargar Artifact |" >> $GITHUB_STEP_SUMMARY
