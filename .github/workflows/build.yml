name: Build ARM v8 APK

on:
  workflow_dispatch: # Solo se activa manualmente desde la pestaña "Actions"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 1. Instalar Gradle directamente (en lugar de usar el wrapper)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 2. REGENERAR EL WRAPPER (Esto soluciona el error del JAR corrupto)
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      # 3. Compilar usando el wrapper recién generado
      - name: Build Debug APK (ARM v8 only)
        run: ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Prepare ZIP
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/ClintBrowser-ARMv8-debug.apk
          cd output
          zip -r ClintBrowser-ARMv8.zip ClintBrowser-ARMv8-debug.apk

      - name: Upload ZIP to Summary
        uses: actions/upload-artifact@v4
        with:
          name: ClintBrowser-ARMv8-ZIP
          path: output/ClintBrowser-ARMv8.zip
          retention-days: 7

      - name: Generate Summary
        run: |
          echo "### ✅ Compilación Exitosa" >> $GITHUB_STEP_SUMMARY
          echo "Descarga tu APK haciendo clic en el botón de abajo." >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | Enlace |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **ClintBrowser-ARMv8.zip** | [Descargar Artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |" >> $GITHUB_STEP_SUMMARY
